version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: chotu_postgres
    restart: always
    environment:
      POSTGRES_USER: restro_user
      POSTGRES_PASSWORD: restro_secure_password_2026
      POSTGRES_DB: chotu_restro_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restro_user -d chotu_restro_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: chotu_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://restro_user:restro_secure_password_2026@db:5432/chotu_restro_ai
      - SECRET_KEY=chotu_restro_ai_super_secret_jwt_key_2026_modern_hospitality
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
